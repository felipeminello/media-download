[project]
name = "media-download"
version = "0.1.0"
description = "CLI para baixar vídeos e áudios do YouTube"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp[default]>=2025.11.12",
]

[project.scripts]
ytdl = "media_download.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_download"]
